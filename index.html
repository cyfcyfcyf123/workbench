/* ---------------- 12. 仪表盘卡片顺序与拖拽排序 ---------------- */
/* 规范化顺序：过滤未知模块、补齐新增模块 */
function normalizeOrder(keys) {
  const out = [];
  (Array.isArray(keys) ? keys : []).forEach(k => {
    if (MODULE_KEYS.indexOf(k) > -1 && out.indexOf(k) < 0) out.push(k);
  });
  MODULE_KEYS.forEach(k => { if (out.indexOf(k) < 0) out.push(k); });
  return out;
}
/* 当前生效顺序（含同步用的更新时间） */
function readOrderMeta() {
  const o = db._order;
  if (!o || !Array.isArray(o.keys) || !o.keys.length) {
    return { keys: MODULE_KEYS.slice(), updatedAt: (o && o.updatedAt) || '' };
  }
  return { keys: normalizeOrder(o.keys), updatedAt: o.updatedAt || '' };
}
function orderedKeys() { return readOrderMeta().keys; }
function setOrder(keys) {
  db._order = { keys: normalizeOrder(keys), updatedAt: nowISO() };
  saveDB();
}
function resetOrder() {
  setOrder(MODULE_KEYS);
  renderNav();
  renderDashboard();
  toast('已恢复默认顺序');
}
/* 设置页里的 ↑↓ 微调 */
function moveModule(key, dir) {
  const keys = orderedKeys();
  const i = keys.indexOf(key);
  const j = dir === 'up' ? i - 1 : i + 1;
  if (i < 0 || j < 0 || j >= keys.length) return;
  keys[i] = keys[j];
  keys[j] = key;
  setOrder(keys);
  renderNav();
  renderSettings();
}
/* 同步合并：顺序以更新时间较新的一方为准（时间相同则保留本地） */
function pickOrder(a, b) {
  const ok = o => !!(o && Array.isArray(o.keys) && o.keys.length);
  if (!ok(a)) return ok(b) ? b : null;
  if (!ok(b)) return a;
  const at = Date.parse(a.updatedAt || '') || 0;
  const bt = Date.parse(b.updatedAt || '') || 0;
  if (at === bt) return a;
  return bt > at ? b : a;
}

/* ---------- 拖拽交互：鼠标 + 触屏（vivo Y78 等手机同样可用） ---------- */
const DRAG_THRESHOLD = 4;   // 鼠标按住后移动超过该距离才算“拖拽”
let dragState = null;       // 拖拽中的状态
let pendingDrag = null;     // 鼠标已按下但还没达到阈值

function dashboardGrid() {
  return state.page === 'dashboard' ? document.querySelector('#view .grid') : null;
}
function gridKeys(grid) {
  return Array.prototype.map.call(grid.children, el => (el.dataset ? el.dataset.module : null)).filter(Boolean);
}

function startDrag(panel, e) {
  const rect = panel.getBoundingClientRect();
  const ghost = document.createElement('div');
  ghost.className = 'drag-ghost';
  ghost.style.width = rect.width + 'px';
  ghost.style.height = rect.height + 'px';
  ghost.style.transform = 'translate(' + rect.left + 'px,' + rect.top + 'px)';
  const inner = panel.cloneNode(true);
  inner.classList.add('drag-lift');
  ghost.appendChild(inner);
  document.body.appendChild(ghost);

  panel.classList.add('drag-src');
  document.body.classList.add('dragging');
  try { if (window.getSelection) window.getSelection().removeAllRanges(); } catch (err) { /* 忽略 */ }

  dragState = {
    panel, ghost, inner,
    pointerId: e.pointerId,
    startX: e.clientX, startY: e.clientY,
    lastX: e.clientX, lastY: e.clientY,
    startRect: rect,
    startOrderMeta: JSON.parse(JSON.stringify(db._order || { keys: [], updatedAt: '' })),
    moved: false,
    raf: 0
  };
  dragState.raf = requestAnimationFrame(dragTick);
  dragListeners(true);
}

function moveGhost() {
  const d = dragState, r = d.startRect;
  d.ghost.style.transform = 'translate(' +
    (r.left + d.lastX - d.startX) + 'px,' + (r.top + d.lastY - d.startY) + 'px)';
}

/* 指针落在卡片之间的空隙时，取中心最近的一张卡片 */
function nearestPanel(grid, x, y) {
  let best = null, bd = Infinity;
  Array.prototype.forEach.call(grid.children, el => {
    if (!el.classList || !el.classList.contains('panel')) return;
    const r = el.getBoundingClientRect();
    const cx = r.left + r.width / 2 - x, cy = r.top + r.height / 2 - y;
    const d = cx * cx + cy * cy;
    if (d < bd) { bd = d; best = el; }
  });
  return best;
}

/* 指针移到哪张卡片上，就把空位插到那边（左半边插前、右半边插后） */
function updateDropTarget(x, y) {
  const d = dragState;
  const grid = d.panel.parentNode;
  if (!grid) return;

  const under = document.elementFromPoint(x, y);
  let target = under && under.closest ? under.closest('.panel') : null;
  if (target && target.parentNode !== grid) target = null;
  if (!target) {
    const gr = grid.getBoundingClientRect();          // 落在卡片间隙 / 网格外
    if (x < gr.left - 40 || x > gr.right + 40 || y < gr.top - 40 || y > gr.bottom + 40) return;
    target = nearestPanel(grid, x, y);
  }
  if (!target || target === d.panel) return;

  const r = target.getBoundingClientRect();
  if ((x - r.left) < r.width / 2) {
    if (target.previousElementSibling === d.panel) return;
    flipReorder(grid, () => grid.insertBefore(d.panel, target));
  } else {
    if (target.nextElementSibling === d.panel) return;
    flipReorder(grid, () => grid.insertBefore(d.panel, target.nextElementSibling));
  }
}

/* FLIP：其余卡片平滑让位。用 offsetLeft/Top 取排版位置，避免受进行中的动画干扰 */
function flipReorder(grid, mutate) {
  const items = Array.prototype.filter.call(grid.children, el => el.classList && el.classList.contains('panel'));
  const from = items.map(el => ({ el, l: el.offsetLeft, t: el.offsetTop }));
  mutate();
  from.forEach(item => {
    const el = item.el;
    const dx = item.l - el.offsetLeft;
    const dy = item.t - el.offsetTop;
    if (!dx && !dy) return;
    el.dataset.flip = String((Number(el.dataset.flip) || 0) + 1);
    const token = el.dataset.flip;
    el.style.transition = 'none';
    el.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    requestAnimationFrame(() => {
      if (!el.isConnected || el.dataset.flip !== token) return;
      el.style.transition = 'transform .18s ease';
      el.style.transform = '';
    });
  });
}

/* 拖到屏幕上下边缘时自动滚动 */
function dragTick() {
  const d = dragState;
  if (!d) return;
  if (d.moved) {
    const sc = document.querySelector('.main');
    const edge = 96, vh = window.innerHeight;
    let dy = 0;
    if (d.lastY < edge) dy = (d.lastY - edge) * 0.4;
    else if (d.lastY > vh - edge) dy = (d.lastY - (vh - edge)) * 0.4;
    if (dy && sc) {
      const before = sc.scrollTop;
      sc.scrollTop = before + dy;
      if (sc.scrollTop !== before) updateDropTarget(d.lastX, d.lastY);
    }
  }
  d.raf = requestAnimationFrame(dragTick);
}

function onDragMove(e) {
  if (pendingDrag) {
    if (Math.abs(e.clientX - pendingDrag.x) <= DRAG_THRESHOLD &&
        Math.abs(e.clientY - pendingDrag.y) <= DRAG_THRESHOLD) return;
    const p = pendingDrag;
    pendingDrag = null;
    startDrag(p.panel, e);
  }
  const d = dragState;
  if (!d) return;
  d.moved = true;
  d.lastX = e.clientX;
  d.lastY = e.clientY;
  moveGhost();
  updateDropTarget(e.clientX, e.clientY);
}

function onDragUp() {
  if (pendingDrag) { pendingDrag = null; dragListeners(false); return; }
  if (dragState) finishDrag(false);
}

function onDragCancel() {
  if (pendingDrag) { pendingDrag = null; dragListeners(false); return; }
  if (dragState) finishDrag(true);
}

function finishDrag(cancelled) {
  const d = dragState;
  if (!d) return;
  dragState = null;
  if (d.raf) cancelAnimationFrame(d.raf);
  dragListeners(false);
  document.body.classList.remove('dragging');

  if (cancelled) {                       // 取消：完全还原（不写入新的更新时间）
    d.ghost.remove();
    db._order = d.startOrderMeta;
    saveDB();
    renderNav();
    renderDashboard();
    toast('已取消调整');
    return;
  }
  if (!d.moved) {                        // 只是点了一下手柄，不做任何改变
    d.ghost.remove();
    d.panel.classList.remove('drag-src');
    return;
  }

  // 立即落库（动画只是视觉收尾）
  const grid = d.panel.parentNode;
  const keys = grid ? gridKeys(grid) : [];
  const changed = !!keys.length && keys.join() !== d.startOrderMeta.keys.join();
  if (changed) { setOrder(keys); renderNav(); }

  // 浮起的卡片平滑落回空位
  const r = d.panel.getBoundingClientRect();
  d.ghost.style.transition = 'transform .18s ease';
  d.inner.style.transform = 'scale(1)';
  d.ghost.style.transform = 'translate(' + r.left + 'px,' + r.top + 'px)';

  const ghost = d.ghost, panel = d.panel;
  setTimeout(() => {
    ghost.remove();
    panel.classList.remove('drag-src');
    if (dragState) return;               // 又开始了新的拖拽，先不重建 DOM
    renderDashboard();
    if (changed) toast('已调整模块顺序');
  }, 190);
}

function dragListeners(on) {
  const opt = true;                      // 捕获阶段，避免被其它逻辑打断
  const fn = on ? document.addEventListener : document.removeEventListener;
  fn.call(document, 'pointermove', onDragMove, opt);
  fn.call(document, 'pointerup', onDragUp, opt);
  fn.call(document, 'pointercancel', onDragCancel, opt);
}

/* 按下：手柄可直接拖；鼠标在卡片空白处按住并移动也能拖（触屏只用手柄，避免和页面滚动打架） */
document.addEventListener('pointerdown', (e) => {
  if (dragState || pendingDrag) return;
  const grid = dashboardGrid();
  if (!grid) return;
  const panel = e.target.closest ? e.target.closest('.panel') : null;
  if (!panel || !grid.contains(panel)) return;

  if (e.target.closest('[data-drag]')) {
    e.preventDefault();
    startDrag(panel, e);
    return;
  }
  if (e.pointerType === 'mouse' && e.button === 0 &&
      !e.target.closest('button, a, input, select, textarea')) {
    pendingDrag = { panel, x: e.clientX, y: e.clientY };
    dragListeners(true);
  }
});

/* ---------------- 13. 事件绑定 ---------------- */
$('#nav').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-page]');
  if (btn) go(btn.dataset.page);
});

$('#view').addEventListener('click', (e) => {
  const goto = e.target.closest('[data-goto]');
  if (goto) { go(goto.dataset.goto); return; }

  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const { act, key, id } = btn.dataset;
  if (act === 'edit') openModal(key, id);
  else if (act === 'del') deleteItem(key, id);
  else if (act === 'toggle') toggleItem(key, id);
});

/* 记账图表：切换查看收入 / 支出占比 */
$('#view').addEventListener('change', (e) => {
  if (e.target.id === 'pieType') {
    state.pieType = e.target.value;
    renderModule('account');
  }
});

/* 各模块的数据导出（记账 → Excel） */
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-export]');
  if (!b) return;
  if (b.dataset.export === 'account') exportAccountXlsx();
});

/* 所有同步按钮（侧边栏、设置页、顶栏）统一走这里 */
document.addEventListener('click', (e) => {
  const s = e.target.closest('[data-sync]');
  if (s && !s.disabled) runSync(s.dataset.sync);
});

$('#modalSave').addEventListener('click', saveModal);
$('#modalCancel').addEventListener('click', closeModal);
$('#modalClose').addEventListener('click', closeModal);
$('#mask').addEventListener('click', (e) => { if (e.target === $('#mask')) closeModal(); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && (dragState || pendingDrag)) { onDragCancel(); return; }   // 拖拽中按 Esc 取消
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && $('#mask').classList.contains('show')) { saveModal(); return; }
  if (e.key !== 'Escape') return;
  if ($('#cfMask').classList.contains('show')) closeConflict(null);   // 取消同步，本地数据不变
  else if ($('#mask').classList.contains('show')) closeModal();
});
$('#cfMask').addEventListener('click', (e) => { if (e.target === $('#cfMask')) closeConflict(null); });

$('#exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '薄荷工作台备份-' + todayStr() + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('已导出备份文件');
});

$('#clearBtn').addEventListener('click', () => {
  if (!confirm('确定清空全部本地数据吗？该操作不可恢复，建议先导出备份。')) return;
  db = withMeta(clone(EMPTY_DB));
  saveDB();
  toast('已清空全部数据');
  go('dashboard');
});

/* ---------------- 14. 初始化 ---------------- */
(function init() {
  if (!localStorage.getItem(STORAGE_KEY) && db.todo.length === 0 && db.memo.length === 0) {
    // 首次使用写入一条示例，帮助快速上手
    db.memo.push({ id: uid(), createdAt: nowISO(), content: '欢迎使用薄荷工作台 🌿 所有数据保存在本机浏览器中。' });
    saveDB();
  }
  renderNav();
  renderDashboard();
  renderSyncState();

  // 考试倒计时提醒：页面内提示 + 可选的系统通知
  const rem = examReminders();
  if (rem.length) {
    const first = rem[0];
    setTimeout(() => toast('⏰ ' + first.i.name + ' 还有 ' + first.d + ' 天'), 900);
  }
  maybeNotifyExams();

  // 离线可用：联网状态变化时更新提示，并在网络恢复后自动同步
  window.addEventListener('online', () => {
    renderSyncState();
    if (state.page === 'settings') renderSettings();
    toast('网络已恢复');
    if (settings.autoPull && configuredCloud()) runSync('pull');
  });
  window.addEventListener('offline', () => {
    renderSyncState();
    if (state.page === 'settings') renderSettings();
    toast('已进入离线模式，数据仍保存在本机');
  });

  // 打开时自动合并一次
  if (settings.autoPull && configuredCloud() && navigator.onLine) {
    setTimeout(() => runSync('pull'), 1200);
  }

  // PWA：仅在 http(s) 环境下注册 Service Worker（直接双击本地文件时自动跳过）
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => { /* 忽略注册失败 */ });
    });
  }
})();
</script>
